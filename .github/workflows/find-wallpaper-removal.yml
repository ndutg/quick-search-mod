name: Dump Source Files for Investigation

on:
  workflow_dispatch:

jobs:
  dump-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout restore-wallpaper-feature
        uses: actions/checkout@v4
        with:
          ref: restore-wallpaper-feature

      - name: Dump WallpaperUtils.kt
        run: |
          echo "========== WallpaperUtils.kt =========="
          cat app/src/main/java/com/tk/quicksearch/shared/util/WallpaperUtils.kt || echo "NOT FOUND"

      - name: Dump AppThemeSettings.kt
        run: |
          echo "========== AppThemeSettings.kt =========="
          cat app/src/main/java/com/tk/quicksearch/settings/appearanceSettings/AppThemeSettings.kt || echo "NOT FOUND"

      - name: Dump search screen composables for background rendering
        run: |
          echo "========== Looking for wallpaper/background rendering =========="
          grep -rn "wallpaper\|Wallpaper\|WallpaperUtils\|backgroundBitmap\|blur\|scrim\|overlay" \
            app/src/main/java/com/tk/quicksearch/ \
            --include="*.kt" -l

          echo ""
          echo "========== Files referencing WallpaperUtils =========="
          grep -rn "WallpaperUtils" \
            app/src/main/java/com/tk/quicksearch/ \
            --include="*.kt"

      - name: Dump icon pack related files
        run: |
          echo "========== Icon pack files =========="
          find app/src/main/java/com/tk/quicksearch/ -name "*.kt" | xargs grep -l -i "iconpack\|icon_pack\|IconPack\|iconPack\|THEMES\|adw" || echo "No icon pack files found"

          echo ""
          echo "========== Icon pack code =========="
          find app/src/main/java/com/tk/quicksearch/ -name "*Icon*Pack*" -o -name "*icon*pack*" | while read f; do
            echo ""
            echo "========== $f =========="
            cat "$f"
          done

      - name: Dump color/theme related code
        run: |
          echo "========== Theme/color files referencing wallpaper =========="
          grep -rn "textColor\|TextColor\|onBackground\|onSurface\|contentColor\|wallpaper" \
            app/src/main/java/com/tk/quicksearch/shared/ \
            --include="*.kt" | head -60

          echo ""
          echo "========== AppColors or design tokens =========="
          find app/src/main/java/com/tk/quicksearch/ -name "*Color*" -o -name "*Theme*" -o -name "*DesignToken*" | while read f; do
            echo ""
            echo "========== $f =========="
            cat "$f"
          done

      - name: Dump SettingsRouteFlows for wallpaper toggle
        run: |
          echo "========== SettingsRouteFlows.kt =========="
          cat app/src/main/java/com/tk/quicksearch/settings/shared/settingsRoute/SettingsRouteFlows.kt || echo "NOT FOUND"
