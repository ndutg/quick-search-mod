name: Dump Full WallpaperUtils

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout restore-wallpaper-feature
        uses: actions/checkout@v4
        with:
          ref: restore-wallpaper-feature

      - name: Upload WallpaperUtils.kt as artifact
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperUtils-full
          path: app/src/main/java/com/tk/quicksearch/shared/util/WallpaperUtils.kt
