name: Comment on close

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  comment:
    name: Add release comment
    # Only comment when closed as completed (skips "not planned" and "duplicate").
    if: github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on closed issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Available in the [latest release](https://github.com/teja2495/quick-search/releases)',
            });
            core.info(`Commented on issue #${context.issue.number}.`);
