name: Generate Signing Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias quicksearch \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore release.keystore \
            -storepass quicksearch123 \
            -keypass quicksearch123 \
            -dname "CN=Quick Search Mod, OU=Personal, O=Personal, L=Christchurch, ST=Canterbury, C=NZ"

          echo "✅ Keystore generated successfully"
          keytool -list -keystore release.keystore -storepass quicksearch123

      - name: Encode keystore to base64
        run: |
          base64 -w 0 release.keystore > keystore_base64.txt
          echo ""
          echo "========================================="
          echo "COPY THE ENTIRE LINE BELOW AS YOUR SECRET"
          echo "========================================="
          cat keystore_base64.txt
          echo ""
          echo "========================================="

      - name: Upload keystore as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore
