name: Sync Feature Branch with Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout restore-wallpaper-feature
        uses: actions/checkout@v4
        with:
          ref: restore-wallpaper-feature
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Fetch latest main
        run: |
          git fetch origin main
          echo "=== Commits to merge ==="
          git log --oneline restore-wallpaper-feature..origin/main | head -30

      - name: Attempt merge with smart conflict resolution
        run: |
          echo "=== Attempting merge ==="
          if git merge origin/main --no-edit; then
            echo "Merge completed cleanly"
          else
            echo "Conflicts detected - taking upstream for all conflicted files..."
            CONFLICTED=$(git diff --name-only --diff-filter=U)
            echo "Conflicted files:"
            echo "$CONFLICTED"
            for f in $CONFLICTED; do
              echo "  Taking upstream version of: $f"
              git checkout --theirs "$f"
              git add "$f"
            done
            git commit --no-edit
            echo "Merge completed - all conflicts resolved to upstream"
          fi

      - name: Re-apply patch 1 - READ_MEDIA_IMAGES in manifest
        run: |
          FILE="app/src/main/AndroidManifest.xml"
          if grep -q "READ_MEDIA_IMAGES" "$FILE"; then
            echo "READ_MEDIA_IMAGES already present"
          else
            echo "Re-adding READ_MEDIA_IMAGES permission"
            sed -i 's|<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"|<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"|' "$FILE"
          fi
          echo -n "Verification: "
          grep -q "READ_MEDIA_IMAGES" "$FILE" && echo "OK" || echo "FAILED"

      - name: Re-apply patch 2 - Dark scrim in SearchScreenBackground.kt
        run: |
          python3 << 'PYEOF'
          file_path = "app/src/main/java/com/tk/quicksearch/search/searchScreen/SearchScreenBackground.kt"
          with open(file_path, "r") as f:
              content = f.read()

          if "Dark scrim for text readability" in content:
              print("Scrim already present")
          else:
              if "import androidx.compose.ui.graphics.Color" not in content:
                  content = content.replace(
                      "import com.tk.quicksearch.shared.ui.theme.DesignTokens",
                      "import com.tk.quicksearch.shared.ui.theme.DesignTokens\nimport androidx.compose.ui.graphics.Color"
                  )
                  print("Added Color import")

              anchor = "                // Tint overlay (dark mode: darken, light mode: lighten)"
              scrim = """                // Dark scrim for text readability over any wallpaper
                Box(
                    modifier =
                        Modifier
                            .fillMaxSize()
                            .background(Color.Black.copy(alpha = 0.3f))
                            .graphicsLayer(alpha = wallpaperLayerAlpha),
                )

                // Tint overlay (dark mode: darken, light mode: lighten)"""

              if anchor in content:
                  content = content.replace(anchor, scrim)
                  print("Added scrim before tint overlay")
              else:
                  print("WARNING: Could not find tint overlay anchor - scrim NOT applied")
                  print("Upstream may have refactored SearchScreenBackground.kt - manual check needed")

              with open(file_path, "w") as f:
                  f.write(content)
          PYEOF
          echo -n "Verification: "
          grep -q "Dark scrim for text readability" app/src/main/java/com/tk/quicksearch/search/searchScreen/SearchScreenBackground.kt && echo "OK" || echo "NEEDS MANUAL CHECK"

      - name: Re-apply patch 3 - App refresh on unfreeze
        run: |
          python3 << 'PYEOF'
          file_path = "app/src/main/java/com/tk/quicksearch/search/data/AppsRepository.kt"
          with open(file_path, "r") as f:
              content = f.read()

          old_changed = "override fun onPackageChanged(packageName: String, user: UserHandle) = Unit"
          new_changed = (
              "override fun onPackageChanged(packageName: String, user: UserHandle) =\n"
              "                    invalidate(AppCatalogChange.forPackage(packageName, user, isRemoval = false))"
          )
          if old_changed in content:
              content = content.replace(old_changed, new_changed)
              print("Re-applied onPackageChanged patch")
          elif "isRemoval = false))" in content and "onPackageChanged" in content:
              print("onPackageChanged already patched")
          else:
              print("WARNING: onPackageChanged anchor not found - upstream may have changed it")

          old_avail = "override fun onPackagesAvailable(packageNames: Array<out String>, user: UserHandle, replacing: Boolean) = Unit"
          new_avail = (
              "override fun onPackagesAvailable(packageNames: Array<out String>, user: UserHandle, replacing: Boolean) =\n"
              "                    packageNames.forEach { invalidate(AppCatalogChange.forPackage(it, user, isRemoval = false)) }"
          )
          if old_avail in content:
              content = content.replace(old_avail, new_avail)
              print("Re-applied onPackagesAvailable patch")
          elif "packageNames.forEach { invalidate" in content:
              print("onPackagesAvailable already patched")
          else:
              print("WARNING: onPackagesAvailable anchor not found - upstream may have changed it")

          with open(file_path, "w") as f:
              f.write(content)
          PYEOF
          echo -n "Verification: "
          grep -q "packageNames.forEach { invalidate" app/src/main/java/com/tk/quicksearch/search/data/AppsRepository.kt && echo "OK" || echo "NEEDS MANUAL CHECK"

      - name: Commit re-applied patches
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No patch re-application needed (patches survived merge)"
          else
            git commit -m "chore: re-apply mod patches after upstream sync"
            echo "Re-applied patches committed"
          fi

      - name: Verify final state
        run: |
          echo "=== Custom patches check ==="
          FAIL=0

          echo -n "Patch 1 - READ_MEDIA_IMAGES in manifest: "
          if grep -q "READ_MEDIA_IMAGES" app/src/main/AndroidManifest.xml; then
            echo "OK"
          else
            echo "MISSING"; FAIL=1
          fi

          echo -n "Patch 2 - Dark scrim in SearchScreenBackground.kt: "
          if grep -q "Dark scrim for text readability" app/src/main/java/com/tk/quicksearch/search/searchScreen/SearchScreenBackground.kt; then
            echo "OK"
          else
            echo "MISSING (upstream may have refactored the file)"; FAIL=1
          fi

          echo -n "Patch 3 - App refresh on unfreeze: "
          if grep -q "packageNames.forEach { invalidate" app/src/main/java/com/tk/quicksearch/search/data/AppsRepository.kt; then
            echo "OK"
          else
            echo "MISSING (upstream may have refactored the file)"; FAIL=1
          fi

          echo ""
          if [ "$FAIL" = "0" ]; then
            echo "All 3 patches present"
          else
            echo "WARNING: One or more patches missing - review before relying on the build"
          fi

      - name: Push
        run: |
          git push origin restore-wallpaper-feature
          echo ""
          echo "restore-wallpaper-feature synced and pushed"
          echo "APK build will auto-trigger"
