name: Sync Feature Branch with Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout restore-wallpaper-feature
        uses: actions/checkout@v4
        with:
          ref: restore-wallpaper-feature
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Fetch latest main
        run: |
          git fetch origin main
          echo "=== Commits to merge ==="
          git log --oneline restore-wallpaper-feature..origin/main | head -20

      - name: Attempt merge with conflict resolution
        run: |
          echo "=== Attempting merge ==="
          if git merge origin/main --no-edit; then
            echo "✅ Merge completed cleanly"
          else
            echo "⚠️ Conflicts detected — resolving..."

            # List conflicted files
            CONFLICTED=$(git diff --name-only --diff-filter=U)
            echo "Conflicted files:"
            echo "$CONFLICTED"

            for f in $CONFLICTED; do
              echo ""
              echo "=== Resolving: $f ==="

              if [[ "$f" == *"WallpaperUtils.kt"* ]]; then
                # For WallpaperUtils: accept upstream version, then re-add our cache invalidation lines
                echo "Strategy: accept upstream + re-add contrast cache invalidation"
                git checkout --theirs "$f"
                
                # Re-add our WallpaperContrastUtils invalidation calls
                python3 << 'PYEOF'
          file_path = "app/src/main/java/com/tk/quicksearch/shared/util/WallpaperUtils.kt"
          with open(file_path, "r") as f:
              content = f.read()

          # Add contrast invalidation in invalidateWallpaperCache if not present
          if "WallpaperContrastUtils.invalidateWallpaperLightnessCache()" not in content:
              content = content.replace(
                  "cachedWallpaperAppearance = null",
                  "cachedWallpaperAppearance = null\n        WallpaperContrastUtils.invalidateWallpaperLightnessCache()"
              )
              print("✅ Re-added contrast invalidation in invalidateWallpaperCache")

          # Add contrast clearAll in clearMemoryCaches if not present
          if "WallpaperContrastUtils.clearAll()" not in content:
              content = content.replace(
                  "cachedOverlayCustomAppearance = null",
                  "cachedOverlayCustomAppearance = null\n        WallpaperContrastUtils.clearAll()"
              )
              print("✅ Re-added contrast clearAll in clearMemoryCaches")

          with open(file_path, "w") as f:
              f.write(content)
          PYEOF

              elif [[ "$f" == *"SettingsDetailRoute.kt"* ]]; then
                # For SettingsDetailRoute: accept upstream version
                # Our wallpaper revert added a route entry here, but upstream restructured it
                # Accept upstream and check if wallpaper settings still work
                echo "Strategy: accept upstream version"
                git checkout --theirs "$f"

              else
                # For any other file: accept upstream
                echo "Strategy: accept upstream version (default)"
                git checkout --theirs "$f"
              fi

              git add "$f"
              echo "✅ Resolved: $f"
            done

            # Complete the merge
            git commit --no-edit
            echo "✅ Merge completed with conflict resolution"
          fi

      - name: Verify custom patches
        run: |
          echo "=== Custom patches check ==="

          echo -n "WallpaperContrastUtils.kt: "
          [ -f "app/src/main/java/com/tk/quicksearch/shared/util/WallpaperContrastUtils.kt" ] && echo "✅" || echo "❌"

          echo -n "Dark scrim in SearchScreenBackground.kt: "
          grep -q "Dark scrim for text readability" app/src/main/java/com/tk/quicksearch/search/searchScreen/SearchScreenBackground.kt && echo "✅" || echo "❌"

          echo -n "White label fix in AppGridView.kt: "
          grep -q "scrim makes background dark" app/src/main/java/com/tk/quicksearch/search/apps/AppGridView.kt && echo "✅" || echo "❌"

          echo -n "READ_MEDIA_IMAGES in manifest: "
          grep -q "READ_MEDIA_IMAGES" app/src/main/AndroidManifest.xml && echo "✅" || echo "❌"

          echo -n "LocalWallpaperIsLight in Theme.kt: "
          grep -q "LocalWallpaperIsLight" app/src/main/java/com/tk/quicksearch/shared/ui/theme/Theme.kt && echo "✅" || echo "❌"

          echo -n "Contrast invalidation in WallpaperUtils.kt: "
          grep -q "WallpaperContrastUtils" app/src/main/java/com/tk/quicksearch/shared/util/WallpaperUtils.kt && echo "✅" || echo "⚠️ (optional)"

      - name: Push
        run: |
          git push origin restore-wallpaper-feature
          echo ""
          echo "✅ restore-wallpaper-feature synced and pushed"
          echo "APK build will auto-trigger"
