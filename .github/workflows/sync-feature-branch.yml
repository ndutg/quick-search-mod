name: Sync Feature Branch with Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout restore-wallpaper-feature
        uses: actions/checkout@v4
        with:
          ref: restore-wallpaper-feature
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Fetch latest main
        run: |
          git fetch origin main
          echo "=== Commits to merge ==="
          git log --oneline restore-wallpaper-feature..origin/main | head -20

      - name: Attempt merge with conflict resolution
        run: |
          echo "=== Attempting merge ==="
          if git merge origin/main --no-edit; then
            echo "Merge completed cleanly"
          else
            echo "Conflicts detected - resolving..."
            CONFLICTED=$(git diff --name-only --diff-filter=U)
            echo "Conflicted files:"
            echo "$CONFLICTED"

            for f in $CONFLICTED; do
              echo ""
              echo "=== Resolving: $f ==="
              # Our 3 mod files: use "ours" to preserve our patches
              if [[ "$f" == *"AndroidManifest.xml"* ]]; then
                echo "Strategy: keep OUR version (has READ_MEDIA_IMAGES)"
                git checkout --ours "$f"
              elif [[ "$f" == *"SearchScreenBackground.kt"* ]]; then
                echo "Strategy: keep OUR version (has dark scrim)"
                git checkout --ours "$f"
              elif [[ "$f" == *"AppGridView.kt"* ]]; then
                echo "Strategy: keep OUR version (has white label)"
                git checkout --ours "$f"
              else
                echo "Strategy: accept upstream version (default)"
                git checkout --theirs "$f"
              fi
              git add "$f"
              echo "Resolved: $f"
            done

            git commit --no-edit
            echo "Merge completed with conflict resolution"
          fi

      - name: Verify custom patches survived
        run: |
          echo "=== Custom patches check ==="

          FAIL=0

          echo -n "READ_MEDIA_IMAGES in manifest: "
          if grep -q "READ_MEDIA_IMAGES" app/src/main/AndroidManifest.xml; then
            echo "OK"
          else
            echo "MISSING"
            FAIL=1
          fi

          echo -n "Dark scrim in SearchScreenBackground.kt: "
          if grep -q "Dark scrim for text readability" app/src/main/java/com/tk/quicksearch/search/searchScreen/SearchScreenBackground.kt; then
            echo "OK"
          else
            echo "MISSING"
            FAIL=1
          fi

          echo -n "White label fix in AppGridView.kt: "
          if grep -q "scrim makes background dark" app/src/main/java/com/tk/quicksearch/search/apps/AppGridView.kt; then
            echo "OK"
          else
            echo "MISSING"
            FAIL=1
          fi

          echo ""
          if [ "$FAIL" = "0" ]; then
            echo "All 3 custom patches survived the sync"
          else
            echo "One or more patches were lost — investigate before pushing"
            exit 1
          fi

      - name: Push
        run: |
          git push origin restore-wallpaper-feature
          echo ""
          echo "restore-wallpaper-feature synced and pushed"
          echo "APK build will auto-trigger"
