name: Patch Wallpaper Contrast

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout restore-wallpaper-feature
        uses: actions/checkout@v4
        with:
          ref: restore-wallpaper-feature
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Fix SearchScreenBackground.kt
        run: |
          FILE="app/src/main/java/com/tk/quicksearch/search/searchScreen/SearchScreenBackground.kt"

          python3 << 'PYEOF'
          file_path = "app/src/main/java/com/tk/quicksearch/search/searchScreen/SearchScreenBackground.kt"

          with open(file_path, "r") as f:
              content = f.read()

          # Step 1: Remove the broken scrim that was inserted inside Image()
          # The broken insertion put the scrim between .blur() and .graphicsLayer()
          # We need to restore the original Image() call

          # Remove the broken scrim block
          broken_scrim = """
                    // Scrim overlay for text readability over wallpaper
                    Box(
                        modifier = Modifier
                            .fillMaxSize()
                            .background(Color.Black.copy(alpha = 0.35f))
                    )"""

          if broken_scrim in content:
              content = content.replace(broken_scrim, "")
              print("✅ Removed broken scrim insertion from inside Image()")
          else:
              # Try alternate whitespace patterns
              import re
              content = re.sub(
                  r'\s*// Scrim overlay for text readability over wallpaper\s*'
                  r'Box\(\s*modifier\s*=\s*Modifier\s*'
                  r'\.fillMaxSize\(\)\s*'
                  r'\.background\(Color\.Black\.copy\(alpha\s*=\s*0\.35f\)\)\s*\)',
                  '',
                  content
              )
              print("✅ Removed broken scrim insertion (regex)")

          # Step 2: Add a proper scrim Box AFTER the existing tint overlay Box
          # The existing code has:
          #   // Tint overlay (dark mode: darken, light mode: lighten)
          #   Box(modifier = Modifier.fillMaxSize().background(AppColors.WallpaperOverlayTint...))
          #
          # We add our scrim BEFORE the tint overlay, AFTER the Image()

          scrim_block = """
                    // Dark scrim for text readability over any wallpaper
                    Box(
                        modifier =
                            Modifier
                                .fillMaxSize()
                                .background(Color.Black.copy(alpha = 0.3f))
                                .graphicsLayer(alpha = wallpaperLayerAlpha),
                    )
          """

          if "// Dark scrim for text readability" not in content:
              # Insert before the existing tint overlay
              content = content.replace(
                  "                    // Tint overlay (dark mode: darken, light mode: lighten)",
                  scrim_block.rstrip() + "\n\n                    // Tint overlay (dark mode: darken, light mode: lighten)"
              )
              print("✅ Added scrim Box before tint overlay")
          else:
              print("ℹ️ Scrim already present")

          # Step 3: Remove unused Color import if we added it to wrong file earlier
          # (SearchScreenWallpaper.kt)
          with open(file_path, "w") as f:
              f.write(content)

          # Verify the Image() call is intact
          if "bitmap = bitmap," in content and ".graphicsLayer(alpha = wallpaperLayerAlpha)," in content:
              print("✅ Image() composable is intact")
          else:
              print("⚠️ Image() composable may be broken — check manually")

          # Show context around the scrim
          lines = content.split("\n")
          for i, line in enumerate(lines):
              if "Dark scrim for text readability" in line:
                  start = max(0, i - 3)
                  end = min(len(lines), i + 15)
                  print("\n=== Context around scrim ===")
                  for j in range(start, end):
                      print(f"  {j+1}: {lines[j]}")
                  break

          print("\n✅ SearchScreenBackground.kt fixed and saved")
          PYEOF

      - name: Verify final file compiles correctly
        run: |
          FILE="app/src/main/java/com/tk/quicksearch/search/searchScreen/SearchScreenBackground.kt"

          echo "=== Checking Image() is complete ==="
          grep -A8 "Image(" "$FILE" | head -12

          echo ""
          echo "=== Checking scrim is in right place ==="
          grep -B2 -A8 "Dark scrim" "$FILE"

          echo ""
          echo "=== Checking tint overlay is intact ==="
          grep -B2 -A6 "Tint overlay" "$FILE"

      - name: Commit and push
        run: |
          git add -A
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "⚠️ No changes to commit"
          else
            git commit -m "fix: correct scrim placement - add before tint overlay, not inside Image()"
            git push origin restore-wallpaper-feature
            echo "✅ Changes pushed — build will auto-trigger"
          fi
