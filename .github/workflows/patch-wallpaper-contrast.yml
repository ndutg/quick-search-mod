name: Patch Wallpaper Contrast

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout restore-wallpaper-feature
        uses: actions/checkout@v4
        with:
          ref: restore-wallpaper-feature
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Fix SearchScreenBackground.kt
        run: |
          python3 << 'PYEOF'
          file_path = "app/src/main/java/com/tk/quicksearch/search/searchScreen/SearchScreenBackground.kt"

          with open(file_path, "r") as f:
              lines = f.readlines()

          new_lines = []
          skip_scrim_block = False
          scrim_lines_removed = 0
          scrim_inserted = False

          i = 0
          while i < len(lines):
              line = lines[i]
              stripped = line.strip()

              # Remove any previously broken scrim block
              if "// Scrim overlay for text readability" in line or "// Dark scrim for text readability" in line:
                  skip_scrim_block = True
                  scrim_lines_removed += 1
                  i += 1
                  continue

              if skip_scrim_block:
                  # Skip lines that are part of the scrim Box() block
                  if stripped in ["Box(", "modifier = Modifier", ".fillMaxSize()", ")", ""] or \
                     ".background(Color.Black.copy" in stripped or \
                     ".graphicsLayer(alpha = wallpaperLayerAlpha)," in stripped or \
                     "modifier =" == stripped:
                      scrim_lines_removed += 1
                      i += 1
                      # End the skip when we hit the closing )
                      if stripped == ")":
                          skip_scrim_block = False
                      continue
                  else:
                      skip_scrim_block = False

              # Insert scrim BEFORE the tint overlay comment
              if "Tint overlay" in line and "dark mode" in line and not scrim_inserted:
                  # Detect the indentation from the tint overlay line
                  indent = line[:len(line) - len(line.lstrip())]

                  new_lines.append(f"{indent}// Dark scrim for text readability over any wallpaper\n")
                  new_lines.append(f"{indent}Box(\n")
                  new_lines.append(f"{indent}    modifier =\n")
                  new_lines.append(f"{indent}        Modifier\n")
                  new_lines.append(f"{indent}            .fillMaxSize()\n")
                  new_lines.append(f"{indent}            .background(Color.Black.copy(alpha = 0.3f))\n")
                  new_lines.append(f"{indent}            .graphicsLayer(alpha = wallpaperLayerAlpha),\n")
                  new_lines.append(f"{indent})\n")
                  new_lines.append(f"\n")
                  scrim_inserted = True
                  print(f"✅ Inserted scrim at line {len(new_lines)} with indent='{indent}'")

              new_lines.append(line)
              i += 1

          # Ensure Color import exists
          has_color_import = any("import androidx.compose.ui.graphics.Color" in l for l in new_lines)
          if not has_color_import:
              for i, line in enumerate(new_lines):
                  if "import androidx.compose.ui.graphics.ImageBitmap" in line:
                      new_lines.insert(i + 1, "import androidx.compose.ui.graphics.Color\n")
                      print("✅ Added Color import")
                      break

          with open(file_path, "w") as f:
              f.writelines(new_lines)

          if scrim_lines_removed > 0:
              print(f"✅ Removed {scrim_lines_removed} broken scrim lines")
          if scrim_inserted:
              print("✅ Scrim properly inserted before tint overlay")
          else:
              print("⚠️ Could not find tint overlay comment to insert scrim")

          # Verify
          with open(file_path, "r") as f:
              final = f.read()

          if "Dark scrim for text readability" in final:
              print("✅ VERIFIED: Scrim text found in final file")
          else:
              print("❌ FAILED: Scrim text NOT found")

          if "bitmap = bitmap," in final and "contentScale = ContentScale.Crop" in final:
              print("✅ VERIFIED: Image() composable intact")
          else:
              print("⚠️ Image() composable may be broken")

          # Show context
          final_lines = final.split("\n")
          for i, line in enumerate(final_lines):
              if "Dark scrim" in line:
                  start = max(0, i - 5)
                  end = min(len(final_lines), i + 15)
                  print("\n=== Context around scrim ===")
                  for j in range(start, end):
                      marker = ">>>" if j == i else "   "
                      print(f"{marker} {j+1}: {final_lines[j]}")
                  break

          print("\n✅ Done")
          PYEOF

      - name: Commit and push
        run: |
          git add -A
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "⚠️ No changes to commit"
          else
            git commit -m "fix: proper scrim overlay between wallpaper Image and tint overlay"
            git push origin restore-wallpaper-feature
            echo "✅ Changes pushed — build will auto-trigger"
          fi
