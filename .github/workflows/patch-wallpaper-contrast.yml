name: Patch Wallpaper Contrast

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout restore-wallpaper-feature
        uses: actions/checkout@v4
        with:
          ref: restore-wallpaper-feature
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Fix SearchScreenBackground.kt
        run: |
          python3 << 'PYEOF'
          file_path = "app/src/main/java/com/tk/quicksearch/search/searchScreen/SearchScreenBackground.kt"

          with open(file_path, "r") as f:
              lines = f.readlines()

          new_lines = []
          graphicslayer_restored = False
          scrim_exists = False

          for i, line in enumerate(lines):
              stripped = line.strip()

              # Check if scrim already exists
              if "Dark scrim for text readability" in line:
                  scrim_exists = True

              # Fix: restore the missing .graphicsLayer line after .blur(...)
              # The line after .blur should be .graphicsLayer, but currently it jumps to contentScale
              if ".blur(radius = effectiveBlurRadius.dp)" in stripped and not graphicslayer_restored:
                  new_lines.append(line)
                  # Check if the next line is NOT .graphicsLayer (meaning it was deleted)
                  if i + 1 < len(lines):
                      next_stripped = lines[i + 1].strip()
                      if ".graphicsLayer" not in next_stripped:
                          # Restore the missing line with matching indentation
                          indent = line[:len(line) - len(line.lstrip())]
                          new_lines.append(f"{indent}    .graphicsLayer(alpha = wallpaperLayerAlpha),\n")
                          graphicslayer_restored = True
                          print("✅ Restored missing .graphicsLayer(alpha = wallpaperLayerAlpha) line")
                      else:
                          print("ℹ️ .graphicsLayer already present after .blur")
                  continue

              new_lines.append(line)

          # Now add the scrim if it doesn't exist
          if not scrim_exists:
              final_lines = []
              for i, line in enumerate(new_lines):
                  # Insert scrim before tint overlay
                  if "Tint overlay" in line and "dark mode" in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      final_lines.append(f"{indent}// Dark scrim for text readability over any wallpaper\n")
                      final_lines.append(f"{indent}Box(\n")
                      final_lines.append(f"{indent}    modifier =\n")
                      final_lines.append(f"{indent}        Modifier\n")
                      final_lines.append(f"{indent}            .fillMaxSize()\n")
                      final_lines.append(f"{indent}            .background(Color.Black.copy(alpha = 0.3f))\n")
                      final_lines.append(f"{indent}            .graphicsLayer(alpha = wallpaperLayerAlpha),\n")
                      final_lines.append(f"{indent})\n")
                      final_lines.append(f"\n")
                      print("✅ Added scrim Box before tint overlay")
                  final_lines.append(line)
              new_lines = final_lines

          # Ensure Color import exists
          has_color_import = any("import androidx.compose.ui.graphics.Color" in l for l in new_lines)
          if not has_color_import:
              for i, line in enumerate(new_lines):
                  if "import androidx.compose.ui.graphics.ImageBitmap" in line:
                      new_lines.insert(i + 1, "import androidx.compose.ui.graphics.Color\n")
                      print("✅ Added Color import")
                      break

          with open(file_path, "w") as f:
              f.writelines(new_lines)

          # Verify
          with open(file_path, "r") as f:
              final = f.read()

          # Check Image() is complete
          if ".blur(radius = effectiveBlurRadius.dp)" in final and \
             ".graphicsLayer(alpha = wallpaperLayerAlpha)," in final and \
             "contentScale = ContentScale.Crop," in final:
              print("✅ VERIFIED: Image() composable is complete")
          else:
              print("❌ Image() composable may still be broken")

          if "Dark scrim for text readability" in final:
              print("✅ VERIFIED: Scrim present")
          else:
              print("❌ Scrim NOT found")

          if "Tint overlay" in final:
              print("✅ VERIFIED: Tint overlay intact")
          else:
              print("❌ Tint overlay missing")

          # Show Image area
          final_lines = final.split("\n")
          for i, line in enumerate(final_lines):
              if "Image(" in line and "bitmap" not in line:
                  start = max(0, i)
                  end = min(len(final_lines), i + 25)
                  print(f"\n=== Image() through scrim and tint (lines {start+1}-{end+1}) ===")
                  for j in range(start, end):
                      print(f"  {j+1}: {final_lines[j]}")
                  break

          print("\n✅ Done")
          PYEOF

      - name: Commit and push
        run: |
          git add -A
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "⚠️ No changes to commit"
          else
            git commit -m "fix: restore missing graphicsLayer in Image() + proper scrim placement"
            git push origin restore-wallpaper-feature
            echo "✅ Changes pushed — build will auto-trigger"
          fi
