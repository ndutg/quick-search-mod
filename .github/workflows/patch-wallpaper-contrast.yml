name: Patch Wallpaper Contrast

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout restore-wallpaper-feature
        uses: actions/checkout@v4
        with:
          ref: restore-wallpaper-feature
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Revert Theme.kt to remove global override
        run: |
          FILE="app/src/main/java/com/tk/quicksearch/shared/ui/theme/Theme.kt"

          python3 << 'PYEOF'
          file_path = "app/src/main/java/com/tk/quicksearch/shared/ui/theme/Theme.kt"

          with open(file_path, "r") as f:
              content = f.read()

          # 1. Remove the contrastAwareScheme block entirely
          #    Replace the block with nothing, and restore colorScheme in MaterialTheme
          content = content.replace("colorScheme = contrastAwareScheme,", "colorScheme = colorScheme,")
          print("✅ Restored colorScheme in MaterialTheme")

          # 2. Remove the contrastAwareScheme variable block
          import re
          content = re.sub(
              r'\s*// Override text-facing colors when image background.*?'
              r'val contrastAwareScheme =.*?colorScheme\s*\}\s*\n',
              '\n',
              content,
              flags=re.DOTALL
          )
          print("✅ Removed contrastAwareScheme block")

          with open(file_path, "w") as f:
              f.write(content)

          print("✅ Theme.kt cleaned up — global override removed")
          print("   (LocalWallpaperIsLight and isWallpaperLight kept for future use)")
          PYEOF

      - name: Find and patch SearchScreenWallpaper.kt with scrim overlay
        run: |
          FILE="app/src/main/java/com/tk/quicksearch/search/searchScreen/searchScreen/SearchScreenWallpaper.kt"

          echo "=== Current SearchScreenWallpaper.kt ==="
          cat "$FILE"

          echo ""
          echo "=== Patching with scrim overlay ==="

          python3 << 'PYEOF'
          file_path = "app/src/main/java/com/tk/quicksearch/search/searchScreen/searchScreen/SearchScreenWallpaper.kt"

          with open(file_path, "r") as f:
              content = f.read()

          # Add necessary imports if not present
          imports_to_add = []
          if "import androidx.compose.foundation.background" not in content:
              imports_to_add.append("import androidx.compose.foundation.background")
          if "import androidx.compose.ui.graphics.Color" not in content:
              imports_to_add.append("import androidx.compose.ui.graphics.Color")
          if "import androidx.compose.foundation.layout.Box" not in content:
              imports_to_add.append("import androidx.compose.foundation.layout.Box")
          if "import androidx.compose.foundation.layout.fillMaxSize" not in content:
              imports_to_add.append("import androidx.compose.foundation.layout.fillMaxSize")

          if imports_to_add:
              # Find last import line and add after it
              import re
              last_import = None
              for m in re.finditer(r'^import .+$', content, re.MULTILINE):
                  last_import = m
              if last_import:
                  insert_pos = last_import.end()
                  content = content[:insert_pos] + "\n" + "\n".join(imports_to_add) + content[insert_pos:]
                  print(f"✅ Added {len(imports_to_add)} missing imports")

          # Save the file so we can inspect it
          with open(file_path, "w") as f:
              f.write(content)

          print("✅ Imports updated")
          print("")
          print("=== Now searching for Image composable to add scrim after ==="

          # Look for the pattern where the wallpaper bitmap Image is drawn
          # We need to add a Box with scrim overlay right after it
          )
          PYEOF

      - name: Inspect SearchScreenWallpaper.kt structure
        run: |
          FILE="app/src/main/java/com/tk/quicksearch/search/searchScreen/searchScreen/SearchScreenWallpaper.kt"

          echo "=== Lines containing Image, Box, bitmap, background, Modifier ==="
          grep -n "Image\|Box\|bitmap\|background\|Modifier\|fillMaxSize\|alpha\|scrim\|overlay\|Color" "$FILE" | head -60

          echo ""
          echo "=== Full file content ==="
          cat "$FILE"

      - name: Commit and push
        run: |
          git add -A
          git status
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "⚠️ No changes to commit"
          else
            git commit -m "fix: revert global text override, inspect wallpaper screen for scrim"
            git push origin restore-wallpaper-feature
            echo "✅ Changes pushed"
          fi
