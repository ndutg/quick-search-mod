name: Patch Wallpaper Contrast

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout restore-wallpaper-feature
        uses: actions/checkout@v4
        with:
          ref: restore-wallpaper-feature
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Patch AppGridView.kt label color
        run: |
          FILE="app/src/main/java/com/tk/quicksearch/search/apps/AppGridView.kt"

          echo "=== Before patch ==="
          grep -n "false -> Color" "$FILE"

          # Since we have a dark scrim overlay, the background is always effectively dark
          # when wallpaper is active. So use Color.White for both true and false.
          sed -i 's/false -> Color.Black/false -> Color.White  \/\/ scrim makes background dark/' "$FILE"

          echo ""
          echo "=== After patch ==="
          grep -n "Color.White\|Color.Black\|labelColor" "$FILE" | grep -i "label\|false\|true\|null"

          echo ""
          echo "=== Full AppLabelText function ==="
          grep -A 20 "private fun AppLabelText" "$FILE"

      - name: Commit and push
        run: |
          git add -A
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "⚠️ No changes to commit"
          else
            git commit -m "fix: use white text for app labels when wallpaper + scrim is active"
            git push origin restore-wallpaper-feature
            echo "✅ Changes pushed — build will auto-trigger"
          fi
