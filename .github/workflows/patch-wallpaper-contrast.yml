name: Patch Wallpaper Contrast

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout restore-wallpaper-feature with full history
        uses: actions/checkout@v4
        with:
          ref: restore-wallpaper-feature
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Replace SettingsRouteFlows.kt with upstream version
        run: |
          FILE="app/src/main/java/com/tk/quicksearch/settings/shared/settingsRoute/SettingsRouteFlows.kt"

          echo "=== Restoring upstream version of SettingsRouteFlows.kt ==="
          git checkout origin/main -- "$FILE"

          echo "✅ Replaced with upstream version"

          echo ""
          echo "=== Verify no broken references ==="
          grep -n "requiresImagePermissionAfterSecurityError\|showFallbackDialogOnSecurityError\|shouldShowFallbackDialog" "$FILE" || echo "✅ No old API references"

          echo ""
          echo "=== Verify file compiles context ==="
          grep -n "resolveWallpaperAccessState\|WallpaperAccessState\|securityError\|needsPermission" "$FILE" | head -20

      - name: Commit and push
        run: |
          git add -A
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "⚠️ No changes to commit"
          else
            git commit -m "fix: replace SettingsRouteFlows.kt with upstream version to fix API mismatch"
            git push origin restore-wallpaper-feature
            echo "✅ Changes pushed — build will auto-trigger"
          fi
