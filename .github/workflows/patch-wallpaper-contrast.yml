name: Patch Wallpaper Contrast

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout restore-wallpaper-feature
        uses: actions/checkout@v4
        with:
          ref: restore-wallpaper-feature
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Inspect and fix SettingsRouteFlows.kt
        run: |
          FILE="app/src/main/java/com/tk/quicksearch/settings/shared/settingsRoute/SettingsRouteFlows.kt"

          echo "=== Lines around 115-140 ==="
          sed -n '115,140p' "$FILE"

          echo ""
          echo "=== ALL remaining references to old API names ==="
          grep -n "requiresImagePermissionAfterSecurityError\|showFallbackDialogOnSecurityError\|shouldShowFallbackDialog\|needsPermission" "$FILE"

          echo ""
          echo "=== Fixing: replace ALL occurrences globally ==="

          # Nuclear option: replace every single occurrence in the file
          # The previous patch renamed some but missed function parameter definitions
          sed -i 's/requiresImagePermissionAfterSecurityError/securityError/g' "$FILE"
          sed -i 's/showFallbackDialogOnSecurityError/securityError/g' "$FILE"
          sed -i 's/shouldShowFallbackDialog/securityError/g' "$FILE"

          # Now also fix the var declaration that was already renamed to needsPermission
          # but should be securityError to match the data class field
          sed -i 's/var needsPermission by remember/var securityError by remember/' "$FILE"
          
          # Fix any "needsPermission =" assignments that should be "securityError ="
          # but ONLY the ones that were renamed from requiresImagePermissionAfterSecurityError
          # We need to be careful not to rename accessState.needsPermission
          
          # Actually, let's check what the WallpaperAccessState data class has
          echo ""
          echo "=== WallpaperAccessState fields ==="
          grep -A 8 "data class WallpaperAccessState" app/src/main/java/com/tk/quicksearch/shared/util/WallpaperUtils.kt

          echo ""
          echo "=== After global fix ==="
          grep -n "requiresImagePermissionAfterSecurityError\|showFallbackDialogOnSecurityError\|shouldShowFallbackDialog" "$FILE" || echo "✅ No old references remain"

          echo ""
          echo "=== All securityError and needsPermission references ==="
          grep -n "securityError\|needsPermission" "$FILE"

          echo ""
          echo "=== Context lines 115-140 after fix ==="
          sed -n '115,140p' "$FILE"

          echo ""
          echo "=== Context lines 45-80 after fix ==="
          sed -n '45,80p' "$FILE"

      - name: Commit and push
        run: |
          git add -A
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "⚠️ No changes to commit"
          else
            git commit -m "fix: align all SettingsRouteFlows references with upstream WallpaperAccessState API"
            git push origin restore-wallpaper-feature
            echo "✅ Changes pushed — build will auto-trigger"
          fi
