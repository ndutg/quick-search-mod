name: Revert Wallpaper Removal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git user
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Create restore branch
        run: git checkout -B restore-wallpaper-feature

      - name: Attempt revert and resolve conflicts
        run: |
          echo "=== Attempting revert of d356bc06 ==="
          if git revert --no-edit d356bc06; then
            echo "✅ Revert completed cleanly — no conflicts"
          else
            echo "⚠️ Conflict detected — resolving..."

            # Show which files are conflicted
            echo ""
            echo "=== Conflicted files ==="
            git diff --name-only --diff-filter=U

            # Show the raw conflict content for debugging
            echo ""
            echo "=== strings.xml conflict content ==="
            cat app/src/main/res/values/strings.xml

            echo ""
            echo "=== Resolving strings.xml by keeping both sides ==="

            # Remove conflict markers — keeps content from BOTH sides
            # This adds back the wallpaper strings while preserving current strings
            sed -i '/^<<<<<<< HEAD$/d' app/src/main/res/values/strings.xml
            sed -i '/^=======$/d' app/src/main/res/values/strings.xml
            sed -i '/^>>>>>>> parent of /d' app/src/main/res/values/strings.xml

            # Verify no conflict markers remain
            if grep -q '<<<<<<<\|>>>>>>>' app/src/main/res/values/strings.xml; then
              echo "❌ Conflict markers still present — manual resolution needed"
              cat app/src/main/res/values/strings.xml
              exit 1
            fi

            echo "✅ Conflict markers resolved"

            # Show the resolved file
            echo ""
            echo "=== Resolved strings.xml ==="
            cat app/src/main/res/values/strings.xml

            # Stage and continue
            git add app/src/main/res/values/strings.xml
            git revert --continue --no-edit

            echo ""
            echo "✅ Revert completed with conflict resolution"
          fi

      - name: Show revert result
        run: |
          echo "=== Revert commit ==="
          git log -1 --oneline

          echo ""
          echo "=== Files changed ==="
          git diff --name-only HEAD^..HEAD

          echo ""
          echo "=== Diff stat ==="
          git diff --stat HEAD^..HEAD

      - name: Push branch
        run: |
          git push origin restore-wallpaper-feature --force
          echo ""
          echo "✅ Branch 'restore-wallpaper-feature' pushed successfully"
          echo "Next step: add the build-apk.yml workflow on this branch"
