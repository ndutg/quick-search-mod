name: Build Quick Search APK

on:
  workflow_dispatch:
  push:
    branches:
      - restore-wallpaper-feature

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout restore-wallpaper-feature branch
        uses: actions/checkout@v5
        with:
          ref: restore-wallpaper-feature

      - name: Verify wallpaper code is present
        run: |
          echo "=== Checking AndroidManifest.xml for READ_MEDIA_IMAGES ==="
          grep -n "READ_MEDIA_IMAGES" app/src/main/AndroidManifest.xml || echo "READ_MEDIA_IMAGES NOT FOUND"
          echo ""
          echo "=== Checking WallpaperUtils.kt exists ==="
          if [ -f "app/src/main/java/com/tk/quicksearch/shared/util/WallpaperUtils.kt" ]; then
            echo "WallpaperUtils.kt exists"
          else
            echo "WallpaperUtils.kt NOT FOUND"
          fi
          echo ""
          echo "=== Last 3 commits ==="
          git log -3 --oneline

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -alias quicksearch \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore $GITHUB_WORKSPACE/release.keystore \
            -storepass quicksearch123 \
            -keypass quicksearch123 \
            -dname "CN=Quick Search Mod, OU=Personal, O=Personal, L=Christchurch, ST=Canterbury, C=NZ"
          echo "Keystore generated"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build fdroid release APK
        run: |
          ./gradlew assembleFdroidRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
            -Pandroid.injected.signing.store.password=quicksearch123 \
            -Pandroid.injected.signing.key.alias=quicksearch \
            -Pandroid.injected.signing.key.password=quicksearch123
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Verify APK is signed
        run: |
          RELEASE_APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $RELEASE_APK"
          ls -lh "$RELEASE_APK"
          BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          if $BUILD_TOOLS/apksigner verify --print-certs "$RELEASE_APK"; then
            echo "APK is properly signed"
          else
            echo "APK signature verification failed"
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: quick-search-wallpaper-release
          path: "app/build/outputs/apk/**/*.apk"
