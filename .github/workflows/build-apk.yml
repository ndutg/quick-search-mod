name: Build Quick Search APK

on:
  workflow_dispatch:
  push:
    branches:
      - restore-wallpaper-feature

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout restore-wallpaper-feature branch
        uses: actions/checkout@v4
        with:
          ref: restore-wallpaper-feature

      - name: Verify wallpaper code is present
        run: |
          echo "=== Checking AndroidManifest.xml for READ_MEDIA_IMAGES ==="
          grep -n "READ_MEDIA_IMAGES" app/src/main/AndroidManifest.xml || echo "❌ READ_MEDIA_IMAGES NOT FOUND"

          echo ""
          echo "=== Checking WallpaperUtils.kt exists ==="
          if [ -f "app/src/main/java/com/tk/quicksearch/shared/util/WallpaperUtils.kt" ]; then
            echo "✅ WallpaperUtils.kt exists"
          else
            echo "❌ WallpaperUtils.kt NOT FOUND"
          fi

          echo ""
          echo "=== Last 3 commits ==="
          git log -3 --oneline

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -alias quicksearch \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore app/release.keystore \
            -storepass quicksearch123 \
            -keypass quicksearch123 \
            -dname "CN=Quick Search Mod, OU=Personal, O=Personal, L=Christchurch, ST=Canterbury, C=NZ"
          echo "✅ Keystore generated"

      - name: Create signing config properties
        run: |
          cat > app/signing.properties << EOF
          storeFile=release.keystore
          storePassword=quicksearch123
          keyAlias=quicksearch
          keyPassword=quicksearch123
          EOF
          echo "✅ Signing properties created"

      - name: Inject signing config into build.gradle
        run: |
          # Check if build.gradle.kts or build.gradle exists
          if [ -f "app/build.gradle.kts" ]; then
            BUILD_FILE="app/build.gradle.kts"
            echo "Found: $BUILD_FILE"

            # Inject signing config using sed
            # Add signingConfigs block before buildTypes
            sed -i '/buildTypes {/i \
            signingConfigs {\
                create("release") {\
                    val props = java.util.Properties()\
                    val propsFile = file("signing.properties")\
                    if (propsFile.exists()) {\
                        props.load(propsFile.inputStream())\
                        storeFile = file(props["storeFile"] as String)\
                        storePassword = props["storePassword"] as String\
                        keyAlias = props["keyAlias"] as String\
                        keyPassword = props["keyPassword"] as String\
                    }\
                }\
            }' "$BUILD_FILE"

            # Add signingConfig to release buildType
            sed -i '/buildTypes {/,/}/ { /release {/a \
                signingConfig = signingConfigs.getByName("release")
            }' "$BUILD_FILE"

          elif [ -f "app/build.gradle" ]; then
            BUILD_FILE="app/build.gradle"
            echo "Found: $BUILD_FILE"

            sed -i '/buildTypes {/i \
            signingConfigs {\
                release {\
                    def props = new Properties()\
                    def propsFile = file("signing.properties")\
                    if (propsFile.exists()) {\
                        props.load(propsFile.newDataInputStream())\
                        storeFile file(props["storeFile"])\
                        storePassword props["storePassword"]\
                        keyAlias props["keyAlias"]\
                        keyPassword props["keyPassword"]\
                    }\
                }\
            }' "$BUILD_FILE"

            sed -i '/buildTypes {/,/}/ { /release {/a \
                signingConfig signingConfigs.release
            }' "$BUILD_FILE"
          fi

          echo ""
          echo "=== Build file after injection ==="
          cat "$BUILD_FILE"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Fallback - sign APK manually if needed
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)

          if [ -z "$RELEASE_APK" ]; then
            echo "⚠️ No release APK found — trying debug build instead"
            ./gradlew assembleDebug
            echo "Built debug APK as fallback"
            exit 0
          fi

          BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)

          if $BUILD_TOOLS/apksigner verify "$RELEASE_APK" 2>/dev/null; then
            echo "✅ APK is already signed by Gradle"
          else
            echo "⚠️ Signing APK manually..."

            $BUILD_TOOLS/zipalign -v 4 "$RELEASE_APK" "${RELEASE_APK%.apk}-aligned.apk"

            $BUILD_TOOLS/apksigner sign \
              --ks app/release.keystore \
              --ks-pass pass:quicksearch123 \
              --ks-key-alias quicksearch \
              --key-pass pass:quicksearch123 \
              --out "$RELEASE_APK" \
              "${RELEASE_APK%.apk}-aligned.apk"

            rm -f "${RELEASE_APK%.apk}-aligned.apk"
            echo "✅ APK signed manually"
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: quick-search-wallpaper-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
