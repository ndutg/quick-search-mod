name: Build Quick Search APK

on:
  workflow_dispatch:
  push:
    branches:
      - restore-wallpaper-feature

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout restore-wallpaper-feature branch
        uses: actions/checkout@v4
        with:
          ref: restore-wallpaper-feature

      - name: Verify wallpaper code is present
        run: |
          echo "=== Checking AndroidManifest.xml for READ_MEDIA_IMAGES ==="
          grep -n "READ_MEDIA_IMAGES" app/src/main/AndroidManifest.xml || echo "❌ READ_MEDIA_IMAGES NOT FOUND in manifest"

          echo ""
          echo "=== Checking WallpaperUtils.kt exists ==="
          if [ -f "app/src/main/java/com/tk/quicksearch/shared/util/WallpaperUtils.kt" ]; then
            echo "✅ WallpaperUtils.kt exists"
            head -30 app/src/main/java/com/tk/quicksearch/shared/util/WallpaperUtils.kt
          else
            echo "❌ WallpaperUtils.kt NOT FOUND"
          fi

          echo ""
          echo "=== Checking PermissionHelper.kt for wallpaper permission ==="
          grep -n -i "wallpaper\|READ_MEDIA" app/src/main/java/com/tk/quicksearch/shared/permissions/PermissionHelper.kt || echo "❌ No wallpaper references in PermissionHelper"

          echo ""
          echo "=== Last commit on this branch ==="
          git log -3 --oneline

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-search-wallpaper-debug
          path: app/build/outputs/apk/debug/*.apk
